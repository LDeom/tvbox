name: Additional VOD API audit

on:
  push:
    branches:
      - audit/repair-sources-2026-11
    paths:
      - "audit/additional_vod_api_audit.py"
      - ".github/workflows/additional-vod-api-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/repair-sources-2026-11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check requests
      - name: Discover and test additional VOD APIs
        run: python audit/additional_vod_api_audit.py
      - name: Upload additional VOD API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: additional-vod-api-audit
          path: additional-vod-api-audit-report.json
          if-no-files-found: warn
          retention-days: 14
