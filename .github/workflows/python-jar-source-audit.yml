name: Python and JAR source audit

on:
  push:
    branches:
      - audit/repair-sources-2026-11
    paths:
      - "audit/python_jar_source_audit.py"
      - ".github/workflows/python-jar-source-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/repair-sources-2026-11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check requests
      - name: Check Python syntax, JAR integrity and MD5 references
        run: python audit/python_jar_source_audit.py
      - name: Upload Python and JAR audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-jar-source-audit
          path: python-jar-source-audit-report.json
          if-no-files-found: warn
          retention-days: 14
