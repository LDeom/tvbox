name: Repository source inventory audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/repair-sources-2026-11
    paths:
      - "audit/repository_source_audit.py"
      - "json/dj看球.json"
      - ".github/workflows/repository-source-audit.yml"

concurrency:
  group: repository-source-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/repair-sources-2026-11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check requests json5
      - name: Scan repository source/config files
        run: python audit/repository_source_audit.py
      - name: Upload repository source audit report
        uses: actions/upload-artifact@v4
        with:
          name: repository-source-audit
          path: repository-source-audit-report.json
          if-no-files-found: error
          retention-days: 14
