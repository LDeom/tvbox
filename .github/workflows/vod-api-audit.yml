name: Ordinary VOD API audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/repair-sources-2026-11
    paths:
      - ".github/workflows/vod-api-audit.yml"
      - "audit/vod_api_audit.py"
      - "audit/repository_source_audit.py"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/repair-sources-2026-11

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check requests

      - name: Test ordinary VOD list, search, detail and media URL
        run: python audit/vod_api_audit.py

      - name: Scan repository source/config files
        run: python audit/repository_source_audit.py

      - name: Upload repository source audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-source-audit
          path: repository-source-audit-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JSON audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ordinary-vod-api-audit
          path: vod-api-audit-report.json
          if-no-files-found: warn
          retention-days: 14
